<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Goblin Grotto — Scenery library</title><style>body{background:#152327;color:#d7e0c9;font:15px system-ui;padding:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}figure{margin:0;background:#26383a;padding:16px;border:1px solid #4d6651}.stage{width:192px;height:192px;position:relative;background:repeating-conic-gradient(#23373a 0% 25%,#1c2d30 0% 50%) 50%/64px 64px}.stage img{position:absolute;image-rendering:pixelated;bottom:0;left:50%;transform:translateX(-50%)}.stage::after{content:'';position:absolute;width:64px;height:64px;box-sizing:border-box;bottom:0;left:64px;border:1px solid #b5ce85;pointer-events:none}figcaption{margin-top:10px;font-size:13px;overflow-wrap:anywhere}p{color:#b8c7af}</style></head><body><h1>The grotto’s new scenery</h1><p>153 original sprites at 2×. The outlined square is one 32px logical tile. Trees retain 96×96 canvases and sit on the bottom-middle square.</p><p>Farm pairs: young 01/04, growing 03/05, mature 02/06. <a href="./">Return to the grotto</a></p><main></main><script type="module">
const catalog=await(await fetch('assets/sprite-catalog.json')).json(),main=document.querySelector('main');
for(const f of catalog.sprites){const card=document.createElement('figure'),stage=document.createElement('div'),img=document.createElement('img'),caption=document.createElement('figcaption');stage.className='stage';img.src='assets/'+f.file;img.alt=f.id;img.width=f.width*2;img.height=f.height*2;caption.textContent=f.id+' · '+f.width+'×'+f.height;stage.append(img);card.append(stage,caption);main.append(card);}
</script></body></html>
